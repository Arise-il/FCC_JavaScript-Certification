
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="weather-app">
    <h1>Weather Forecast</h1>
    <p class="subtitle">Check the weather around the world</p>

    <div class="search-container">
      <select id="city-select">
        <option value=""></option>
        <option value="new york">New York</option>
        <option value="los angeles">Los Angeles</option>
        <option value="chicago">Chicago</option>
        <option value="paris">Paris</option>
        <option value="tokyo">Tokyo</option>
        <option value="london">London</option>
      </select>

      <button id="get-weather-btn">Get Weather</button>
    </div>

    <div id="weather-result" class="weather-result" hidden>
      <h2 id="location"></h2>

      <img id="weather-icon" alt="Weather icon">

      <h3 id="weather-main"></h3>

      <div class="temperature">
        <span id="main-temperature"></span>
      </div>

      <div class="weather-details">
        <div>
          <p>Feels Like</p>
          <strong id="feels-like"></strong>
        </div>

        <div>
          <p>Humidity</p>
          <strong id="humidity"></strong>
        </div>

        <div>
          <p>Wind Speed</p>
          <strong id="wind"></strong>
        </div>

        <div>
          <p>Wind Gust</p>
          <strong id="wind-gust"></strong>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
